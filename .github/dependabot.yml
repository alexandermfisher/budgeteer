# =============================================================================
# Dependabot Configuration - Budgeteer
# =============================================================================
# Automated dependency updates for security and version bumps.
# Learn more: https://docs.github.com/en/code-security/dependabot
# =============================================================================

version: 2

updates:
  # -------------------------------------------------------------------------
  # Maven Dependencies (Backend)
  # -------------------------------------------------------------------------
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group Spring Boot related updates together
      spring:
        patterns:
          - "org.springframework*"
        update-types:
          - "minor"
          - "patch"
      # Group test dependency updates together
      testing:
        patterns:
          - "org.testcontainers*"
          - "io.rest-assured*"
          - "io.github.hakky54*"
        update-types:
          - "minor"
          - "patch"

  # -------------------------------------------------------------------------
  # GitHub Actions
  # -------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"

  # -------------------------------------------------------------------------
  # Docker (compose.yaml)
  # -------------------------------------------------------------------------
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
