# =============================================================================
# CI Pipeline - Budgeteer
# =============================================================================
# Runs on every push and pull request
# - Builds and compiles the project
# - Runs unit tests and integration tests
# - Testcontainers automatically starts PostgreSQL for integration tests
# =============================================================================

name: CI

on:
  push:
    branches: ['**']  # All branches
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Build & Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      # -----------------------------------------------------------------------
      # Build — install all modules in reactor order so sibling jars are in
      # local .m2 before downstream modules compile against them
      # -----------------------------------------------------------------------
      - name: Compile project
        run: mvn install -DskipTests --batch-mode --no-transfer-progress

      # -----------------------------------------------------------------------
      # Unit Tests
      # -----------------------------------------------------------------------
      - name: Run unit tests
        run: mvn test -Dtest="*Test" -Dsurefire.failIfNoSpecifiedTests=false --batch-mode --no-transfer-progress

      # -----------------------------------------------------------------------
      # Integration Tests (Testcontainers - PostgreSQL)
      # -----------------------------------------------------------------------
      - name: Run integration tests
        run: mvn test -Dtest="*IT" -Dsurefire.failIfNoSpecifiedTests=false --batch-mode --no-transfer-progress

      # -----------------------------------------------------------------------
      # Test Report Upload (on failure)
      # -----------------------------------------------------------------------
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ===========================================================================
  # Code Style Check (Checkstyle)
  # ===========================================================================
  code-style:
    name: Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      # Install sibling jars first so budgeteer-api can resolve them
      - name: Install modules
        run: mvn install -DskipTests --batch-mode --no-transfer-progress

      - name: Run Checkstyle
        run: mvn checkstyle:check --batch-mode --no-transfer-progress
        continue-on-error: true  # Don't fail build initially, just report
