# =============================================================================
# CI Pipeline - Budgeteer
# =============================================================================
# Runs on every push and pull request
# - Builds and compiles the project
# - Runs unit tests and integration tests
# - Testcontainers automatically starts PostgreSQL for integration tests
# =============================================================================

name: CI

on:
  push:
    branches: ['**']  # All branches
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Build & Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml
      
      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Compile project
        run: mvn compile -DskipTests --batch-mode --no-transfer-progress
      
      # -----------------------------------------------------------------------
      # Unit Tests
      # -----------------------------------------------------------------------
      - name: Run unit tests
        run: mvn test -Dtest="*Test" --batch-mode --no-transfer-progress
      
      # -----------------------------------------------------------------------
      # Integration Tests (Testcontainers - PostgreSQL)
      # -----------------------------------------------------------------------
      - name: Run integration tests
        run: mvn test -Dtest="*IT" --batch-mode --no-transfer-progress
      
      # -----------------------------------------------------------------------
      # Test Report Upload (on failure)
      # -----------------------------------------------------------------------
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  # ===========================================================================
  # Code Style Check (Checkstyle)
  # ===========================================================================
  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml
      
      - name: Run Checkstyle
        run: mvn checkstyle:check --batch-mode --no-transfer-progress
        continue-on-error: true  # Don't fail build initially, just report
