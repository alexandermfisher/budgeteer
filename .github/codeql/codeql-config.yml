# CodeQL Configuration for Budgeteer

name: "Budgeteer CodeQL Config"

# Note: java/log-injection false positives (LogSanitizer usage) are managed via
# GitHub Security alert dismissals, not query-filters. The query-filters.path
# property matches QL query file paths, not source file paths, so per-file
# suppression of specific rules must be done through the GitHub Security UI.
query-filters:
  # Exclude unused-parameter finding (required by Spring exception handler signature)
  - exclude:
      id: java/unused-parameter
