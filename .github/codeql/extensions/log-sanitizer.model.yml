# CodeQL Model Extension for LogSanitizer
# Registers LogSanitizer methods as sanitizers for log injection

extensions:
  - addsTo:
      pack: codeql/java-all
      extensible: summaryModel
    data:
      # LogSanitizer.sanitize(String) - sanitizes input by removing control characters
      - ["dev.amf.budgeteer.util", "LogSanitizer", true, "sanitize", "(String)", "", "Argument[0]", "ReturnValue", "taint", "manual"]
      # LogSanitizer.sanitize(String, int) - sanitizes and truncates
      - ["dev.amf.budgeteer.util", "LogSanitizer", true, "sanitize", "(String,int)", "", "Argument[0]", "ReturnValue", "taint", "manual"]
      # LogSanitizer.mask(String, int) - masks sensitive values
      - ["dev.amf.budgeteer.util", "LogSanitizer", true, "mask", "(String,int)", "", "Argument[0]", "ReturnValue", "taint", "manual"]
      # LogSanitizer.maskEmail(String) - masks email addresses
      - ["dev.amf.budgeteer.util", "LogSanitizer", true, "maskEmail", "(String)", "", "Argument[0]", "ReturnValue", "taint", "manual"]

  - addsTo:
      pack: codeql/java-all
      extensible: neutralModel
    data:
      # Mark LogSanitizer methods as sanitizers (neutral = safe)
      - ["dev.amf.budgeteer.util", "LogSanitizer", "sanitize", "(String)", "summary", "manual"]
      - ["dev.amf.budgeteer.util", "LogSanitizer", "sanitize", "(String,int)", "summary", "manual"]
      - ["dev.amf.budgeteer.util", "LogSanitizer", "mask", "(String,int)", "summary", "manual"]
      - ["dev.amf.budgeteer.util", "LogSanitizer", "maskEmail", "(String)", "summary", "manual"]
