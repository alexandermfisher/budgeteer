# =============================================================================
# DEVELOPMENT PROFILE
# =============================================================================
# Activated by default (see application.properties)
# Override with: SPRING_PROFILE=prod

# =============================================================================
# TOKEN SETTINGS - Relaxed for easier development
# =============================================================================
# Longer expiry times reduce friction during development/testing
app.jwe.access-token-expiry=1h
app.jwe.refresh-token-expiry=30d
app.jwe.magic-link-expiry=30m

# Email disabled - magic links are logged to the console for easy testing
app.email-enabled=false
# Disable mail health check and auto-configuration since email is disabled
management.health.mail.enabled=false
spring.mail.host=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.mail.health.MailHealthContributorAutoConfiguration

# =============================================================================
# LOGGING - Verbose for debugging
# =============================================================================
logging.level.dev.amf.budgeteer=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# JPA - Show SQL for debugging
# =============================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# DEV-SPECIFIC SETTINGS
# =============================================================================
# Helpful error messages in dev
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

# =============================================================================
# DATABASE CLEAN ON STARTUP (Dev Only)
# =============================================================================
# Set to true to wipe the database on every application start
# Useful for testing registration flows with the same email
# Set to false when you want to keep data between restarts
app.database.clean-on-startup=true

# Allow Flyway to clean (required for the above to work)
spring.flyway.clean-disabled=false
