# =============================================================================
# DEVELOPMENT PROFILE
# =============================================================================
# Activated by default (see application.properties)
# Override with: SPRING_PROFILE=prod

# =============================================================================
# TOKEN SETTINGS - Relaxed for easier development
# =============================================================================
# Longer expiry times reduce friction during development/testing
app.jwe.access-token-expiry=1h
app.jwe.refresh-token-expiry=30d
app.jwe.magic-link-expiry=30m

# Email disabled - magic links are logged to console for easy testing
app.email-enabled=false

# =============================================================================
# LOGGING - Verbose for debugging
# =============================================================================
logging.level.dev.amf.budgeteer=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# JPA - Show SQL for debugging
# =============================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# DEV-SPECIFIC SETTINGS
# =============================================================================
# Helpful error messages in dev
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always
