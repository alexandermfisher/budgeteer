# =============================================================================
# DEVELOPMENT PROFILE
# =============================================================================
# Activated by default (see application.properties)
# Override with: SPRING_PROFILE=prod

# =============================================================================
# TOKEN SETTINGS - Relaxed for easier development
# =============================================================================
# Longer expiry times reduce friction during development/testing
app.jwe.access-token-expiry=1h
app.jwe.refresh-token-expiry=30d
app.jwe.magic-link-expiry=30m

# Email disabled by default - magic links are logged to the console for easy testing
# Override with APP_EMAIL_ENABLED=true in .env to enable real email sending
app.email-enabled=${APP_EMAIL_ENABLED:false}

# =============================================================================
# LOGGING - Verbose for debugging
# =============================================================================
logging.level.dev.amf.budgeteer=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# JPA - Show SQL for debugging
# =============================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# DEV-SPECIFIC SETTINGS
# =============================================================================
# Helpful error messages in dev
# Note: the correct prefix is server.error.*, NOT spring.web.error.* (silently ignored)
server.error.include-message=always
server.error.include-stacktrace=always

# =============================================================================
# DATABASE CLEAN ON STARTUP (Dev Only)
# =============================================================================
# Set to true to wipe the database on every application start
# Useful for testing registration flows with the same email
# Set to false when you want to keep data between restarts
app.database.clean-on-startup=true

# Allow Flyway to clean (required for the above to work)
spring.flyway.clean-disabled=false
