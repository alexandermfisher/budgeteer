# =============================================================================
# PRODUCTION PROFILE
# =============================================================================
# Activate with: SPRING_PROFILE=prod

# =============================================================================
# TOKEN SETTINGS - Secure for production
# =============================================================================
# Tighter expiry times for better security
app.jwe.access-token-expiry=15m
app.jwe.refresh-token-expiry=30d
app.jwe.magic-link-expiry=10m

# Email MUST be enabled in production
app.email-enabled=true

# Base URL must be set via environment variable in production
app.base-url=${APP_BASE_URL}

# =============================================================================
# LOGGING - Minimal for production
# =============================================================================
logging.level.root=WARN
logging.level.dev.amf.budgeteer=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# =============================================================================
# JPA - No SQL output in prod
# =============================================================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# DATABASE CONNECTION POOL
# =============================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# =============================================================================
# HIBERNATE OPTIMIZATIONS
# =============================================================================
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =============================================================================
# SECURITY - Hide error details in prod
# =============================================================================
# Note: the correct prefix is server.error.*, NOT spring.web.error.* (silently ignored)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# =============================================================================
# CORS
# =============================================================================
app.cors.allowed-origins=https://budgeteer.dev
