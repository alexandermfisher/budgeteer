spring.application.name=budgeteer

# =============================================================================
# BASE CONFIGURATION (shared by all profiles)
# =============================================================================

# Docker Compose file location (relative to backend/)
spring.docker.compose.file=../compose.yaml

# Active profile (default to dev, override via SPRING_PROFILE env var)
spring.profiles.active=${SPRING_PROFILE:dev}

# Server
server.port=8080

# =============================================================================
# DATABASE
# =============================================================================
# Values can be overridden via environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:budgeteer}
spring.datasource.username=${DB_USER:budgeteer}
spring.datasource.password=${DB_PASSWORD:budgeteer}

# JPA/Hibernate - let Flyway manage the schema
spring.jpa.hibernate.ddl-auto=none

# =============================================================================
# FLYWAY
# =============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# =============================================================================
# MONZO OAUTH
# =============================================================================
# REQUIRED: Set these as environment variables!
monzo.client-id=${MONZO_CLIENT_ID:}
monzo.client-secret=${MONZO_CLIENT_SECRET:}
monzo.redirect-uri=${MONZO_REDIRECT_URI:http://localhost:8080/auth/callback}

# Monzo API URLs (same for dev and prod)
monzo.auth-url=https://auth.monzo.com/
monzo.token-url=https://api.monzo.com/oauth2/token
monzo.api-base-url=https://api.monzo.com

# =============================================================================
# APP AUTHENTICATION (Magic Links + JWE)
# =============================================================================

# App settings
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.login-success-url=/
app.email-enabled=${APP_EMAIL_ENABLED:false}

# Cookie settings
app.cookies.secure=${APP_COOKIES_SECURE:false}

# JWE Token Settings
# REQUIRED: Set JWE_SECRET_KEY as environment variable!
# Generate with: openssl rand -base64 32
app.jwe.secret-key=${JWE_SECRET_KEY:}
app.jwe.access-token-expiry=15m
app.jwe.refresh-token-expiry=7d
app.jwe.magic-link-expiry=15m

# =============================================================================
# EMAIL (for Magic Links)
# =============================================================================
# Set app.email-enabled=true and configure these for production
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
