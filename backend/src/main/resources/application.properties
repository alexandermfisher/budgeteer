spring.application.name=budgeteer

# =============================================================================
# BASE CONFIGURATION (shared by all profiles)
# =============================================================================

# Docker Compose file location (relative to backend/)
spring.docker.compose.file=../compose.yaml

# Active profile (default to dev, override via SPRING_PROFILE env var)
spring.profiles.active=${SPRING_PROFILE:dev}

# Server
server.port=8080

# =============================================================================
# DATABASE
# =============================================================================
# Values can be overridden via environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:budgeteer}
spring.datasource.username=${DB_USER:budgeteer}
spring.datasource.password=${DB_PASSWORD:budgeteer}

# JPA/Hibernate - let Flyway manage the schema
spring.jpa.hibernate.ddl-auto=none

# =============================================================================
# FLYWAY
# =============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# =============================================================================
# MONZO OAUTH
# =============================================================================
# REQUIRED: Set these as environment variables!
monzo.client-id=${MONZO_CLIENT_ID:}
monzo.client-secret=${MONZO_CLIENT_SECRET:}
monzo.redirect-uri=${MONZO_REDIRECT_URI:http://localhost:8080/auth/callback}

# Monzo API URLs (same for dev and prod)
monzo.auth-url=https://auth.monzo.com/
monzo.token-url=https://api.monzo.com/oauth2/token
monzo.api-base-url=https://api.monzo.com

# =============================================================================
# APP AUTHENTICATION (Magic Links + JWE)
# =============================================================================

# App settings
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.login-success-url=/
app.email-enabled=${APP_EMAIL_ENABLED:false}

# Cookie settings
app.cookies.secure=${APP_COOKIES_SECURE:false}

# JWE Token Settings
# REQUIRED: Set JWE_SECRET_KEY as an environment variable!
# Generate with: openssl rand -base64 32
app.jwe.secret-key=${JWE_SECRET_KEY:}
app.jwe.access-token-expiry=15m
app.jwe.refresh-token-expiry=7d
app.jwe.magic-link-expiry=15m

# =============================================================================
# MONZO TOKEN ENCRYPTION
# =============================================================================
# REQUIRED: Set MONZO_ENCRYPTION_KEY as environment variable!
# Used to encrypt Monzo OAuth tokens stored in database (AES-256-GCM)
# Generate with: openssl rand -base64 32
encryption.secret-key=${MONZO_ENCRYPTION_KEY:}

# =============================================================================
# EMAIL (for Magic Links) - Resend SMTP
# =============================================================================
# Set app.email-enabled=true and configure these for production
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# From address (must be verified domain in Resend)
app.mail.from=${MAIL_FROM:noreply@budgeteer.amfshr.dev}

# =============================================================================
# MONZO TOKEN AUTO-REFRESH
# =============================================================================
# Cron schedule for the background token refresh job (every 30 minutes)
monzo.token-refresh.job-cron=0 */30 * * * *

# Refresh tokens expiring within this many minutes (must be > job interval)
monzo.token-refresh.job-refresh-window-minutes=60

# Eager refresh: refresh inline if token expires within this many minutes
monzo.token-refresh.eager-refresh-window-minutes=5

# =============================================================================
# MONZO TRANSACTION SYNC
# =============================================================================
# Cron schedule for the background delta sync job (every 60 minutes)
monzo.transaction-sync.job-cron=0 0 */1 * * *

# Backfill thread pool
monzo.transaction-sync.backfill-core-pool-size=2
monzo.transaction-sync.backfill-max-pool-size=5
monzo.transaction-sync.backfill-queue-capacity=10

# =============================================================================
# ACTUATOR - Monitoring & Health Checks
# =============================================================================
# Enable all actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Info endpoint - Application details
info.app.name=Budgeteer
info.app.description=Personal budgeting application with Monzo integration
info.app.version=0.0.1-SNAPSHOT
info.app.profiles=${spring.profiles.active}

# Health endpoint configuration
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.health.defaults.enabled=true
management.health.mail.enabled=false

# Info endpoint configuration
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
management.info.git.mode=full

# Metrics configuration
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Actuator base path (defaults to /actuator)
management.endpoints.web.base-path=/actuator

# =============================================================================
# CORS
# =============================================================================
# Dev default: Vite dev server. Override per profile.
app.cors.allowed-origins=http://localhost:3000

# =============================================================================
# LOGGING
# =============================================================================
# Log file location (for production JSON logs)
logging.file.name=${LOG_FILE:/var/log/budgeteer/budgeteer.log}
logging.file.path=${LOG_PATH:/var/log/budgeteer}

# Pattern for console (overridden by logback-spring.xml per profile)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%15.15t] %-40.40logger{39} : %m%n

# Logback configuration file
logging.config=classpath:logback-spring.xml
