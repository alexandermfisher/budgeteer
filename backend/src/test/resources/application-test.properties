# =============================================================================
# TEST PROFILE CONFIGURATION
# =============================================================================
# Used by tests with @ActiveProfiles("test")

# -----------------------------------------------------------------------------
# Database (H2 in-memory for fast tests)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway for tests (use Hibernate's ddl-auto)
spring.flyway.enabled=false

# -----------------------------------------------------------------------------
# Disable Docker Compose in tests
# -----------------------------------------------------------------------------
spring.docker.compose.enabled=false

# -----------------------------------------------------------------------------
# JWE Configuration (test key)
# -----------------------------------------------------------------------------
# 32-byte key encoded as base64 for tests
app.jwe.secret-key=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtMzItYnl0ZXM=
app.jwe.access-token-expiry=15m
app.jwe.refresh-token-expiry=1d
app.jwe.magic-link-expiry=15m

# -----------------------------------------------------------------------------
# Encryption Configuration (test key for Monzo tokens)
# -----------------------------------------------------------------------------
# 32-byte key encoded as base64 for tests - "12345678901234567890123456789012" (32 bytes)
encryption.secret-key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

# -----------------------------------------------------------------------------
# App Configuration
# -----------------------------------------------------------------------------
app.base-url=http://localhost:8080
app.email.enabled=false
app.cookies.secure=false

# -----------------------------------------------------------------------------
# CORS
# -----------------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000

# -----------------------------------------------------------------------------
# Logging (minimal for tests)
# -----------------------------------------------------------------------------
logging.level.root=WARN
logging.level.dev.amfshr.budgeteer=DEBUG
logging.level.org.springframework.security=DEBUG

# Disable SQL logging in tests
spring.jpa.show-sql=false

# -----------------------------------------------------------------------------
# Monzo token-refresh (required by MonzoTokenRefreshProperties bean)
# -----------------------------------------------------------------------------
monzo.token-refresh.job-cron=0 */30 * * * *
monzo.token-refresh.job-refresh-window-minutes=60
monzo.token-refresh.eager-refresh-window-minutes=5

# -----------------------------------------------------------------------------
# Monzo transaction sync (required by TransactionSyncProperties bean)
# -----------------------------------------------------------------------------
monzo.transaction-sync.job-cron=0 0 */1 * * *
monzo.transaction-sync.backfill-core-pool-size=2
monzo.transaction-sync.backfill-max-pool-size=5
monzo.transaction-sync.backfill-queue-capacity=10
