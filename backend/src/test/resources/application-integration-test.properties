# =============================================================================
# INTEGRATION TEST PROFILE CONFIGURATION
# =============================================================================
# Used by tests extending AbstractPostgresIntegrationTest
# Database URL is injected dynamically by @ServiceConnection

# =============================================================================
# DATABASE
# =============================================================================
# URL, username, password are set by @ServiceConnection from Testcontainers
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'none' - let Flyway handle schema creation
spring.jpa.hibernate.ddl-auto=none

# =============================================================================
# FLYWAY - ENABLED for integration tests
# =============================================================================
# This is the key difference from application-test.properties
# We want to test that our migrations work with real PostgreSQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =============================================================================
# DOCKER COMPOSE - DISABLED
# =============================================================================
spring.docker.compose.enabled=false

# =============================================================================
# JWE CONFIGURATION (test values)
# =============================================================================
app.jwe.secret-key=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtMzItYnl0ZXM=
app.jwe.access-token-expiry=15m
app.jwe.refresh-token-expiry=1d
app.jwe.magic-link-expiry=15m

# =============================================================================
# APP CONFIGURATION
# =============================================================================
app.base-url=http://localhost:8080
app.email.enabled=false
app.cookies.secure=false

# =============================================================================
# LOGGING
# =============================================================================
logging.level.root=WARN
logging.level.dev.amf.budgeteer=DEBUG
logging.level.org.flywaydb=INFO
spring.jpa.show-sql=false

# Show SQL for debugging if needed
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
