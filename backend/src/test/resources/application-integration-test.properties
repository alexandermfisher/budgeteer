# =============================================================================
# INTEGRATION TEST PROFILE CONFIGURATION
# =============================================================================
# Used by tests extending AbstractPostgresIntegrationTest
# Database URL is injected dynamically by @ServiceConnection

# =============================================================================
# DATABASE
# =============================================================================
# URL, username, password are set by @ServiceConnection from Testcontainers
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'none' - let Flyway handle schema creation
spring.jpa.hibernate.ddl-auto=none

# =============================================================================
# HIKARICP - Connection Pool Configuration for Tests
# =============================================================================
# Reduce pool size and timeouts for test environment
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.leak-detection-threshold=10000

# =============================================================================
# FLYWAY - ENABLED for integration tests
# =============================================================================
# This is the key difference from application-test.properties
# We want to test that our migrations work with real PostgreSQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =============================================================================
# DOCKER COMPOSE - DISABLED
# =============================================================================
spring.docker.compose.enabled=false

# =============================================================================
# JWE CONFIGURATION (test values)
# =============================================================================
app.jwe.secret-key=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtMzItYnl0ZXM=
app.jwe.access-token-expiry=15m
app.jwe.refresh-token-expiry=1d
app.jwe.magic-link-expiry=15m

# =============================================================================
# ENCRYPTION CONFIGURATION (test values for Monzo tokens)
# =============================================================================
# 32-byte key encoded as base64 for tests - "12345678901234567890123456789012" (32 bytes)
encryption.secret-key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

# =============================================================================
# APP CONFIGURATION
# =============================================================================
app.base-url=http://localhost:8080
app.email.enabled=false
app.cookies.secure=false

# =============================================================================
# MONZO OAUTH CONFIGURATION (test values)
# =============================================================================
# These are fake values for integration tests - no real Monzo API calls are made
monzo.client-id=test-client-id
monzo.client-secret=test-client-secret
monzo.redirect-uri=http://localhost:8080/api/monzo/callback
monzo.auth-url=https://auth.monzo.com
monzo.token-url=https://api.monzo.com/oauth2/token
monzo.api-base-url=https://api.monzo.com

# =============================================================================
# MONZO TRANSACTION SYNC CONFIGURATION (test values)
# =============================================================================
monzo.transaction-sync.job-cron=0 0 */1 * * *
monzo.transaction-sync.backfill-core-pool-size=2
monzo.transaction-sync.backfill-max-pool-size=5
monzo.transaction-sync.backfill-queue-capacity=10

# =============================================================================
# CORS
# =============================================================================
app.cors.allowed-origins=http://localhost:3000

# =============================================================================
# LOGGING
# =============================================================================
logging.level.root=WARN
logging.level.dev.amfshr.budgeteer=DEBUG
logging.level.org.flywaydb=INFO
spring.jpa.show-sql=false

# Show SQL for debugging if needed
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
